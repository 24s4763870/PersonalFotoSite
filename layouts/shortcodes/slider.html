<div class="slider-container">
    <div class="slider-wrapper" id="main-slider">
        {{ range first 20 $.Site.Data.photos }} 
        <div class="slide">
            <img src="{{ .url }}" alt="Highlight">
        </div>
        {{ end }}
    </div>

    <button class="slider-btn prev" onclick="moveSlide(-1)"><<</button>
    <button class="slider-btn next" onclick="moveSlide(1)">>></button>

    <div class="dots-container" id="dots-container"></div>
</div>

<style>
.slider-container {
    position: relative; 
    width: 100%;
    max-height: 520px;
    overflow: hidden;
    background-color: #111111;
    border: 2px solid #222222;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    margin: 25px 0;
}

.slider-wrapper {
    display: flex;
    transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

.slide {
    min-width: 100%;
    height: 520px;
    background: #1a1a1a;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.slider-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(17,17,17,0.85);
    color: #ffffff;
    border: 1px solid #333333;
    padding: 16px 20px;
    cursor: pointer;
    border-radius: 0px !important;
    font-weight: bold;
    transition: all 0.2s ease-in-out;
    z-index: 10;
}

.slider-btn:hover {
    background: #8A1A22;
    border-color: #A6192E;
    color: #ffffff;
    box-shadow: 0 0 15px rgba(138, 26, 35, 0.4);
}
.prev { left: 0px; border-left: none; }
.next { right: 0px; border-right: none; }

.dots-container{
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
}

.dot{
    width: 25px;
    height: 4px;
    background: rgba(255, 255, 255, 0.3);
    cursor: pointer;
    transition: 0.3s ease;
}

.dot.active{
    background: #8A1A22;
    width: 35px;
}

</style>

<script>
let currentSlide = 0;
let slideInterval;

function initDots() {
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dots-container');
    dotsContainer.innerHTML = '';

    slides.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => goToSlide(index);
        dotsContainer.appendChild(dot);
    });
}

function updateDots() {
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentSlide);
    });
}

function moveSlide(step) {
    const slides = document.querySelectorAll('.slide');
    if (slides.length === 0) return;
    currentSlide = (currentSlide + step + slides.length) % slides.length;

    document.getElementById('main-slider').style.transform = `translateX(-${currentSlide * 100}%)`;
    updateDots();
}

function goToSlide(index) {
    currentSlide = index;
    document.getElementById('main-slider').style.transform = `translateX(-${currentSlide * 100}%)`;
    updateDots();
}

function startAutoSlide() {
    slideInterval = setInterval(() => moveSlide(1), 5000);
}

function stopAutoSlide() {
    clearInterval(slideInterval);
}

document.addEventListener('DOMContentLoaded', () => {
    initDots();
    startAutoSlide();

    const container = document.querySelector('.slider-container');
    container.addEventListener('mouseenter', stopAutoSlide);
    container.addEventListener('mouseleave', startAutoSlide);
});

</script>
