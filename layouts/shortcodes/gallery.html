{{ $category := .Get "category" | default (.Get "Category") | default "all" }}
 <div id="gallery-container" class="gallery-wrapper">
    </div>

<div id="pagination-controls" class="pagination">
    <button id="prev-btn" class="page-btn" onclick="changePage(-1)">back</button>
    <div class="goto-group">
        <input type="number" id="page-input" min="1" placeholder="Page">
        <button class="goto-btn" onclick="jumpToPage()">Go</button>
    </div>

    <span id="page-info" class="page-info"></span>
    <button id="next-btn" class="page-btn" onclick="changePage(1)">next</button>

</div>

<div id="lightbox-overlay" class="lightbox-overlay" onclick="closeLightbox(event)">
    <button class="lightbox-close-btn" onclick="closeLightbox(event)" title="Close (ESC)">&times;</button>
    <img id="lightbox-img" class="light-img" src="" alt="Zoomed Photo">
</div>

<script>
    // @ts-ignore
    //const rawData = JSON.parse('{{ $.Site.Data.photos | jsonify | safeJS }}');
    const rawData = JSON.parse('{{ $.Site.Data.photos | jsonify }}');
    const targetCategory = "{{ $category }}".toLowerCase().trim();

    //console.log("DEBUG -> Target:", targetCategory, "| Raw Data:", rawData);

    const allPhotos = targetCategory === "all"
        ? rawData
        : rawData.filter(photo => {
            if(!photo || !photo.category) return false;
            const photoCat = photo.category.toLowerCase().replace(/\/$/, "").trim();
            const target = targetCategory.toLowerCase().replace(/\/$/, "").trim();
            if (photoCat === target) return true;
 
            return photoCat.endsWith('/' + target) || photoCat.endsWith(target);
        });

    const itemsPerPage = 45;
    let currentPage = 1;

    function renderGallery(page) {
        const container = document.getElementById('gallery-container');
        const pagination = document.getElementById('pagination-controls');
        container.innerHTML = '';

        if (!allPhotos || allPhotos.length === 0) {
            container.innerHTML =  `
                <div style="text-align:center; padding: 60px 20px; color: #888; width: 100%; grid-column: 1/-1;">
                    <p style="font-size: 1.1em; font-weight: bold; text-transform: uppercase;">📸 Keine Fotos in "${targetCategory}" gefunden</p>
                </div>`;
            pagination.style.display = 'none';
            return;
        }
        pagination.style.display = 'flex';
        const start = (page - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = allPhotos.slice(start, end);

        pageItems.forEach(photo => {
            const card = document.createElement('div');
            card.className = 'gallery-card';
            card.innerHTML = `
                <img src="${photo.url}" 
                     loading="lazy" 
                     decodings="async" 
                     alt="${photo.name}"
                     onclick="openLightbox('${photo.url}')">
            `;
            container.appendChild(card);
        });

        const totalPages = Math.ceil(allPhotos.length / itemsPerPage);
        document.getElementById('page-info').innerText = `PAGE ${page} / ${totalPages}`;
        
        document.getElementById('prev-btn').style.visibility = page === 1 ? 'hidden' : 'visible';
        document.getElementById('next-btn').style.visibility = page >= totalPages ? 'hidden' : 'visible';
        
        if (page > 1) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

    }

    function openLightbox(imgUrl) {
        const overlay = document.getElementById('lightbox-overlay');
        const img = document.getElementById('lightbox-img');
        if (overlay && img) {
            img.src = imgUrl;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
    }

    function closeLightbox(e) {
        if (e && e.target.id === 'lightbox-img') return;

        const overlay = document.getElementById('lightbox-overlay');
        if (overlay) {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });

    function changePage(step) {
        currentPage += step;
        renderGallery(currentPage);
    }

    function jumpToPage() {
        const input = document.getElementById('page-input');
        const targetPage = parseInt(input.value);
        const totalPages = Math.ceil(allPhotos.length / itemsPerPage);

        if (isNaN(targetPage) || targetPage < 1 || targetPage > totalPages) {
            alert(`Bitte gib eine gültige Seitenzahl ein! (1 - ${totalPages})`);
            input.value = '';
            return;
        }

        currentPage = targetPage;
        renderGallery(currentPage);
        input.value = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderGallery(currentPage);
        
        document.getElementById('page-input')?.addEventListener('keypress', function (e){
            if (e.key === 'Enter') {
                jumpToPage();
            }
        });
    });
</script>

<style>
  .gallery-wrapper { width: 100%; column-count: 3; column-gap: 20px; min-height: 200px; }
  .gallery-card { display: inline-block; width: 100%; margin-bottom: 20px; break-inside: avoid; background: #1a1a1a; border: 1px solid #222; }
  .gallery-card img { width: 100%; border-radius: 0px !important; cursor: pointer; transition: 0.3s; display: block; }
  .gallery-card:hover { border-color: #8A1A22; box-shadow: 0 8px 25px rgba(138, 26, 34, 0.25); }

  .pagination { text-align: center; margin: 50px 0; display: flex; justify-content: center; align-items: center; gap: 15px; }
  .page-btn { padding: 10px 22px; background: #8A1A22; color: #fff !important; border: none; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .page-btn:hover { background: #A6192E; }
  .page-info { color: #aaa; font-size: 13px; font-weight: 600; }

  .goto-group { display: flex; align-items: center; gap: 6px; }
  #page-input { width: 65px; height: 38px; text-align: center; background: #1a1a1a; color: #fff; border: 1px solid #333; font-size: 14px; }
  #page-input:focus { border-color: #8A1A22; outline: none; }
  #page-input::-webkit-inner-spin-button, #page-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .goto-btn { height: 38px; padding: 0 14px; background: #333; color: #fff; border: none; font-weight: 700; cursor: pointer; }
  .goto-btn:hover { background: #444; }

  .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
  }
  .lightbox-overlay.active {
      opacity: 1;
      pointer-events: auto;
  }
  .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border: 2px solid #222;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
  }
  .lightbox-close-btn {
      position: absolute;
      top: 25px;
      right: 35px;
      background: #8A1A22;
      color: #ffffff !important;
      border: none;
      font-size: 32px;
      line-height: 1 !important;
      font-family: Arial, sans-serif;
      width: 45px;
      height: 45px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 !important;
      margin: 0;
      border-radius: 4px;
      transition: background 0.2s, transform 0.1s;
      z-index: 100000;
  }
  .lightbox-close-btn:hover {
      background: #A6192E;
      transform: scale(1.08);
  }

  @media (max-width: 1000px) { .gallery-wrapper { column-count: 2; } }
  @media (max-width: 600px) { .gallery-wrapper { column-count: 1; } }
</style>
